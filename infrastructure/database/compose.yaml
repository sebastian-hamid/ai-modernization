services:
  postgres:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_DB: cargotracker
      POSTGRES_USER: db_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/bootstrap_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
    secrets:
      - bootstrap_password
      - app_password
      - migrator_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./bootstrap/10-create-roles.sh:/docker-entrypoint-initdb.d/10-create-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U db_bootstrap -d cargotracker && PGPASSWORD=\"$(cat /run/secrets/bootstrap_password)\" psql -h 127.0.0.1 -U db_bootstrap -d cargotracker -Atqc \"SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'schema_migrator') AND EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'cargo_app') AND EXISTS (SELECT 1 FROM pg_namespace WHERE nspname = 'cargo')\" | grep -qx t"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [database]
    restart: unless-stopped

  migrate:
    image: redgate/flyway:13.12.1@sha256:0d7a2da5f76b279ddde34133a3fc5e6b99f397ecdc8a18661dc7d677edbbb189
    profiles: [migrate]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export FLYWAY_PASSWORD="$(cat /run/secrets/migrator_password)"
        exec flyway migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/cargotracker
      FLYWAY_USER: schema_migrator
      FLYWAY_SCHEMAS: cargo
      FLYWAY_DEFAULT_SCHEMA: cargo
      FLYWAY_TABLE: flyway_schema_history
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
    secrets: [migrator_password]
    volumes:
      - ${KAN22_MIGRATIONS_DIR:-./migrations}:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database]
    restart: "no"

  candidate-app:
    profiles: [candidate-app]
    image: ${KAN18_APP_IMAGE:-ai-modernization-candidate-postgresql:local}
    build:
      context: ../..
      dockerfile: tests/candidate-runtime/postgresql/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8080"
    secrets:
      - app_password
      - application_users
      - application_roles
    networks: [database, candidate-host-access]
    restart: "no"

secrets:
  bootstrap_password:
    file: ${KAN22_SECRET_DIR:?Set KAN22_SECRET_DIR}/bootstrap_password
  app_password:
    file: ${KAN22_SECRET_DIR:?Set KAN22_SECRET_DIR}/app_password
  migrator_password:
    file: ${KAN22_SECRET_DIR:?Set KAN22_SECRET_DIR}/migrator_password
  application_users:
    file: ${KAN22_SECRET_DIR:?Set KAN22_SECRET_DIR}/application-users.properties
  application_roles:
    file: ${KAN22_SECRET_DIR:?Set KAN22_SECRET_DIR}/application-roles.properties

volumes:
  postgres_data:

networks:
  database:
    internal: true
  candidate-host-access:
