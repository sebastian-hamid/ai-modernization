services:
  jenkins:
    image: ai-modernization-jenkins:2.580.1-jdk21.0.13.1
    build:
      context: ..
      dockerfile: infrastructure/jenkins/Dockerfile
    container_name: ai-modernization-jenkins
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home:
