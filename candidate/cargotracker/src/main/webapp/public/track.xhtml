<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets" xmlns:f="jakarta.faces.core">
<ui:composition template="/WEB-INF/templates/public-tracking.xhtml">
<ui:define name="metadata"><f:metadata><f:viewParam name="trackingId" value="#{track.trackingId}"/><f:viewAction action="#{track.lookupOnGet}"/></f:metadata></ui:define>
<ui:define name="title">Track cargo</ui:define><ui:define name="content">
<h1>Track cargo</h1><h:messages styleClass="error"/>
<h:form id="trackingForm"><h:outputLabel for="trackingId" value="Tracking ID"/><h:inputText id="trackingId" value="#{track.trackingId}" required="true" maxlength="8" autocomplete="off"/><h:commandButton id="submit" value="Track cargo" actionListener="#{track.onTrackById}"/></h:form>
<h:panelGroup rendered="#{not empty track.cargo}"><section id="tracking-result"><h2>Cargo <h:outputText id="trackingIdResult" value="#{track.cargo.trackingId}"/></h2>
<p>Current status: <h:outputText value="#{track.cargo.statusText}"/></p><p>Estimated arrival: <h:outputText value="#{track.cargo.eta}"/></p>
<h:panelGroup rendered="#{track.cargo.misdirected}"><p>Cargo is misdirected.</p></h:panelGroup>
<h:panelGroup rendered="#{not empty track.cargo.nextExpectedActivity}"><p><h:outputText value="#{track.cargo.nextExpectedActivity}"/></p></h:panelGroup>
<h:panelGroup rendered="#{not empty track.cargo.events}"><h3>Handling history</h3><ul><ui:repeat value="#{track.cargo.events}" var="event"><li><h:outputText value="#{event.description}"/></li></ui:repeat></ul></h:panelGroup>
</section></h:panelGroup>
</ui:define></ui:composition></html>
