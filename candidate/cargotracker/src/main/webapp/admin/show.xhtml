<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" template="/WEB-INF/templates/candidate.xhtml">
<ui:define name="metadata"><f:metadata><f:viewParam name="trackingId" value="#{cargoPages.trackingId}"/><f:viewAction action="#{cargoPages.load}"/></f:metadata></ui:define><ui:define name="title">Cargo details</ui:define><ui:define name="content">
<h1>Cargo details</h1><h:panelGroup rendered="#{not empty cargoPages.cargo}"><ui:include src="/WEB-INF/templates/cargo-details.xhtml"/>
<h:link outcome="/admin/changeDestination.xhtml" value="Change destination" rendered="#{cargoPages.operator}"><f:param name="trackingId" value="#{cargoPages.cargo.trackingId}"/></h:link> <h:link outcome="/admin/route.xhtml" value="Assign route" rendered="#{cargoPages.operator}"><f:param name="trackingId" value="#{cargoPages.cargo.trackingId}"/></h:link>
<div style="overflow-x:auto" tabindex="0" role="region" aria-label="Itinerary"><h:dataTable id="itinerary" value="#{cargoPages.cargo.legs}" var="leg" rendered="#{cargoPages.cargo.routed}"><h:column><f:facet name="header">Voyage</f:facet>#{leg.voyageNumber}</h:column><h:column><f:facet name="header">From</f:facet>#{leg.from}</h:column><h:column><f:facet name="header">To</f:facet>#{leg.to}</h:column><h:column><f:facet name="header">Departure</f:facet>#{leg.loadTime}</h:column><h:column><f:facet name="header">Arrival</f:facet>#{leg.unloadTime}</h:column></h:dataTable></div></h:panelGroup>
</ui:define></ui:composition>
