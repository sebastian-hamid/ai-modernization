<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" template="/WEB-INF/templates/candidate.xhtml">
<ui:define name="metadata"><f:metadata><f:viewParam name="trackingId" value="#{cargoPages.trackingId}"/><f:viewAction action="#{cargoPages.load}"/></f:metadata></ui:define><ui:define name="title">Cargo details</ui:define><ui:define name="content">
<h1>Cargo details</h1><h:panelGroup rendered="#{not empty cargoPages.cargo}"><dl><dt>Tracking ID</dt><dd id="trackingId">#{cargoPages.cargo.trackingId}</dd><dt>Origin</dt><dd>#{cargoPages.cargo.originName}</dd><dt>Destination</dt><dd id="destination">#{cargoPages.cargo.finalDestinationName}</dd><dt>Arrival deadline</dt><dd>#{cargoPages.cargo.arrivalDeadline}</dd><dt>Status</dt><dd>#{cargoPages.cargo.transportStatus}</dd></dl>
<h:link outcome="/admin/changeDestination.xhtml" value="Change destination" rendered="#{cargoPages.operator}"><f:param name="trackingId" value="#{cargoPages.cargo.trackingId}"/></h:link></h:panelGroup>
</ui:define></ui:composition>
