<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:p="http://primefaces.org/ui" template="/WEB-INF/templates/candidate.xhtml">
<ui:define name="metadata"><f:metadata><f:viewParam name="trackingId" value="#{cargoPages.trackingId}"/><f:viewAction action="#{cargoPages.load}"/></f:metadata></ui:define><ui:define name="title">Change destination</ui:define><ui:define name="content">
